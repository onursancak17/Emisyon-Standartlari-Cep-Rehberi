name: Build Android APK
on:
  push:
    branches: [main, codex/professional-field-guide]
  workflow_dispatch:
jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Validate instructions and reagent data
        run: python3 scripts/validate_manuals.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Create clean Android project
        run: |
          flutter create /tmp/mobile_build --platforms=android --project-name emisyon_standartlari_cep_rehberi --org com.onursancak
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('/tmp/mobile_build')
          shutil.rmtree(p/'lib');shutil.copytree('lib',p/'lib')
          shutil.rmtree(p/'test');shutil.copytree('test',p/'test')
          for f in ['manuals.json','training.json']: 
              (p/'assets').mkdir(exist_ok=True)
              shutil.copyfile('assets/'+f,p/'assets'/f)
          for d in ['equipment','branding']:shutil.copytree('assets/'+d,p/'assets'/d)
          shutil.copyfile('pubspec.yaml',p/'pubspec.yaml')
          PY
          python3 scripts/configure_android.py /tmp/mobile_build
      - name: Install dependencies
        working-directory: /tmp/mobile_build
        run: flutter pub get
      - name: Format and analyze
        working-directory: /tmp/mobile_build
        run: |
          dart format lib test
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Test phone layouts, navigation and narration
        working-directory: /tmp/mobile_build
        run: timeout 240 flutter test --reporter expanded
      - name: Upload UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saha-talimatlari-ui
          path: /tmp/mobile_build/test-output/*.png
          if-no-files-found: warn
      - name: Build APK
        working-directory: /tmp/mobile_build
        run: flutter build apk --release
      - name: Copy APK
        run: |
          mkdir -p build-output
          cp /tmp/mobile_build/build/app/outputs/flutter-apk/app-release.apk build-output/emisyon-saha-talimatlari-v2.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emisyon-saha-talimatlari-v2.1.0
          path: build-output/emisyon-saha-talimatlari-v2.1.0.apk
          if-no-files-found: error

